[project]
name = "datasheet-to-pan-ond"
version = "0.1.0"
description = "Generate PVsyst PAN (PV module) and OND (inverter) files from manufacturer datasheet values."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arun Patra", email = "arun@journium.app" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pvlib>=0.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
ds2panond = "datasheet_to_pan_ond.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_to_pan_ond"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pvlib.*", "scipy.*"]
ignore_missing_imports = true
